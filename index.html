<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Alunos</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app-shell">

  <!-- ================= HEADER (Aula 4, 1.1) ================= -->
  <header class="app-header">
    
    <h1>Lista de Alunos</h1>
    <div class="stats">
      <div><b id="statTotal">0</b>alunos</div>
    </div>
  </header>

  <!-- ================= NAV (Aula 4, 1.4) — busca e ordenação ================= -->
  <nav class="toolbar" aria-label="Busca e ordenação de alunos">
    <div class="searchrow">
      <input id="search" type="text" placeholder="Buscar aluno...">
    </div>
    <div class="sortbar">
      <button class="sortbtn active" data-sort="nome">Nome</button>
      <button class="sortbtn" data-sort="graduacao">Faixa</button>
      <button class="sortbtn" data-sort="idade">Idade</button>
    </div>
  </nav>

  <!-- ================= MAIN — lista de alunos (cada um é um <article>) ================= -->
  <main class="student-main">
    <section id="list" class="list" aria-live="polite"></section>
  </main>


  <!-- ================= FOOTER (Aula 4, 1.6) ================= -->




<button class="fab" id="addBtn" title="Adicionar aluno" type="button">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="script.js"></script>

</body>
</html>
