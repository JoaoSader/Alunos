<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Alunos do Dojô</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <h1>Lista de Alunos</h1>
  <div class="stats">
    <div><b id="statTotal">0</b>alunos</div>
    <div><b id="statMedia">0</b>idade média</div>
  </div>
  <div class="sortbar">
    <button class="sortbtn active" data-sort="nome">A–Z Nome</button>
    <button class="sortbtn" data-sort="graduacao">Faixa</button>
    <button class="sortbtn" data-sort="idade">Idade</button>
  </div>
</header>

<main>
  <div class="searchrow">
    <input id="search" type="text" placeholder="Buscar aluno...">
  </div>
  <div id="list" class="list"></div>
</main>

<button class="fab" id="addBtn" title="Adicionar aluno">+</button>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, onSnapshot,
  addDoc, updateDoc, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBZwjp9B0vJ0LHtB2kIDNRhpps3T4EkD88",
  authDomain: "dojo-alunos.firebaseapp.com",
  projectId: "dojo-alunos",
  storageBucket: "dojo-alunos.firebasestorage.app",
  messagingSenderId: "1009769955949",
  appId: "1:1009769955949:web:5059c2fc8445c26e96f564",
  measurementId: "G-H9YHCMN2TY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const alunosRef = collection(db, "alunos");

const BELT_ORDER = ["Branca","Cinza","Azul","Amarela","Laranja","Verde","Roxa","Marrom","Preta"];
const BELT_COLORS = {
  "Branca":  {bg:"var(--white-belt)", fg:"#4a4a45", strip:"var(--white-belt-b)"},
  "Cinza":   {bg:"#eceded", fg:"#4a4d50", strip:"var(--gray-belt)"},
  "Azul":    {bg:"#e5edf8", fg:"var(--blue-belt)", strip:"var(--blue-belt)"},
  "Amarela": {bg:"#fbf1cf", fg:"#8a6d00", strip:"var(--yellow-belt)"},
  "Laranja": {bg:"#fbe6d5", fg:"#a1470c", strip:"var(--orange-belt)"},
  "Verde":   {bg:"#e1f0e2", fg:"var(--green-belt)", strip:"var(--green-belt)"},
  "Roxa":    {bg:"#ece2f5", fg:"var(--purple-belt)", strip:"var(--purple-belt)"},
  "Marrom":  {bg:"#e9dcd2", fg:"var(--brown-belt)", strip:"var(--brown-belt)"},
  "Preta":   {bg:"#e6e6e6", fg:"#111", strip:"var(--black-belt)"}
};

let students = [];
let currentSort = "nome";
let searchTerm = "";

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

// Escuta o Firestore em tempo real: qualquer alteração feita em qualquer
// aparelho atualiza a lista automaticamente aqui.
onSnapshot(alunosRef, (snapshot)=>{
  students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}, (err)=>{
  console.error("Erro ao ler dados", err);
  toast("Não foi possível carregar os dados.");
});

function sortStudents(list){
  const arr = [...list];
  if(currentSort === "nome"){
    arr.sort((a,b)=> a.nome.localeCompare(b.nome, 'pt-BR'));
  } else if(currentSort === "graduacao"){
    arr.sort((a,b)=> BELT_ORDER.indexOf(a.graduacao) - BELT_ORDER.indexOf(b.graduacao) || a.nome.localeCompare(b.nome,'pt-BR'));
  } else if(currentSort === "idade"){
    arr.sort((a,b)=> a.idade - b.idade || a.nome.localeCompare(b.nome,'pt-BR'));
  }
  return arr;
}

function render(){
  const listEl = document.getElementById('list');
  let data = sortStudents(students);
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    data = data.filter(s => s.nome.toLowerCase().includes(q));
  }

  document.getElementById('statTotal').textContent = students.length;
  const avg = students.length ? Math.round(students.reduce((s,x)=>s+Number(x.idade||0),0)/students.length) : 0;
  document.getElementById('statMedia').textContent = avg;

  if(data.length === 0){
    listEl.innerHTML = `<div class="empty"><b>Nenhum aluno encontrado</b>Toque no + para adicionar o primeiro aluno do dojô.</div>`;
    return;
  }

  listEl.innerHTML = data.map(s=>{
    const belt = BELT_COLORS[s.graduacao] || BELT_COLORS["Branca"];
    return `
    <div class="card" data-id="${s.id}">
      <div class="belt-strip" style="background:${belt.strip}"></div>
      <div class="card-body">
        <div style="min-width:0;">
          <div class="card-name">${escapeHtml(s.nome)}</div>
          <div class="card-sub">Toque para ver detalhes</div>
        </div>
        <div class="card-right">
          <span class="belt-tag" style="background:${belt.bg}; color:${belt.fg}">${s.graduacao}</span>
          <span class="age-badge">${s.idade}a</span>
          <span class="chev">›</span>
        </div>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.getAttribute('data-id');
      openDetail(id);
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openOverlay(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeOverlay();
});

function openDetail(id){
  const s = students.find(x=>x.id===id);
  if(!s) return;
  const belt = BELT_COLORS[s.graduacao] || BELT_COLORS["Branca"];
  openOverlay(`
    <div class="sheet-handle"></div>
    <h2>${escapeHtml(s.nome)}</h2>
    <span class="detail-belt" style="background:${belt.bg}; color:${belt.fg}">Faixa ${s.graduacao}</span>
    <div class="detail-grid">
      <div class="detail-box">
        <div class="lbl">Graduação</div>
        <div class="val">${s.graduacao}</div>
      </div>
      <div class="detail-box">
        <div class="lbl">Idade</div>
        <div class="val">${s.idade} anos</div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn-edit" onclick="openEdit('${s.id}')">Editar</button>
      <button class="btn-del" onclick="deleteStudent('${s.id}')">Excluir</button>
    </div>
  `);
}

function openEdit(id){
  const s = id ? students.find(x=>x.id===id) : null;
  const beltOptions = BELT_ORDER.map(b=>`<option value="${b}" ${s && s.graduacao===b ? 'selected':''}>${b}</option>`).join('');
  openOverlay(`
    <div class="sheet-handle"></div>
    <h2>${s ? 'Editar aluno' : 'Novo aluno'}</h2>
    <form class="editform" id="studentForm">
      <div>
        <label>Nome completo</label>
        <input type="text" id="fNome" value="${s ? escapeHtml(s.nome) : ''}" required>
      </div>
      <div>
        <label>Graduação (faixa)</label>
        <select id="fGraduacao">${beltOptions}</select>
      </div>
      <div>
        <label>Idade</label>
        <input type="number" id="fIdade" min="3" max="99" value="${s ? s.idade : ''}" required>
      </div>
      <div class="save-row">
        <button type="button" class="btn-cancel" onclick="closeOverlay()">Cancelar</button>
        <button type="submit" class="btn-save">Salvar</button>
      </div>
    </form>
  `);
  document.getElementById('studentForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const nome = document.getElementById('fNome').value.trim();
    const graduacao = document.getElementById('fGraduacao').value;
    const idade = parseInt(document.getElementById('fIdade').value, 10);
    if(!nome || !idade){ return; }
    try{
      if(s){
        await updateDoc(doc(db, "alunos", s.id), { nome, graduacao, idade });
      }else{
        await addDoc(alunosRef, { nome, graduacao, idade });
      }
      closeOverlay();
      toast(s ? "Aluno atualizado" : "Aluno adicionado");
    }catch(err){
      console.error("Falha ao salvar", err);
      toast("Não foi possível salvar. Tente novamente.");
    }
  });
}
window.openEdit = openEdit;

async function deleteStudent(id){
  try{
    await deleteDoc(doc(db, "alunos", id));
    closeOverlay();
    toast("Aluno removido");
  }catch(err){
    console.error("Falha ao excluir", err);
    toast("Não foi possível excluir. Tente novamente.");
  }
}
window.deleteStudent = deleteStudent;

document.getElementById('addBtn').addEventListener('click', ()=> openEdit(null));

document.querySelectorAll('.sortbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.sortbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.getAttribute('data-sort');
    render();
  });
});

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});
</script>
</body>
</html>
